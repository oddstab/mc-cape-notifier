name: Minecraft Cape Notifier

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "發送測試通知確認 Telegram 連線"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  check-capes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Minecraft Wiki and notify Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_TEST: ${{ github.event.inputs.send_test }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet state.json; then
            git add state.json
            git commit -m "chore: update cape state"
            git push
          fi
